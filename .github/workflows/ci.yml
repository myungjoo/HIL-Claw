name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group dev
      - name: ruff check
        run: python -m ruff check .
      - name: ruff format --check
        run: python -m ruff format --check .
      - name: pytest
        run: python -m pytest

  sh:
    name: sh gate (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        shell: bash
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck --shell=sh

  test-presence:
    name: Test presence (hilclaw)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test file for every hilclaw module
        shell: bash
        run: |
          list=$(mktemp)
          git ls-files -z -- 'hilclaw/*.py' > "$list"
          mapfile -d '' -t modules < "$list"
          rm "$list"
          checked=0
          missing=0
          for module in "${modules[@]}"; do
            name=${module##*/}
            [[ $name != __init__.py ]] || continue
            checked=$((checked + 1))
            dir=${module%/*}
            expected="tests${dir#hilclaw}/test_${name}"
            if ! git ls-files --error-unmatch -- ":(literal)${expected}" > /dev/null; then
              echo "::error file=${module}::${module} has no test file ${expected}"
              missing=$((missing + 1))
            fi
          done
          echo "checked ${checked} module(s) under hilclaw/, ${missing} without a test file"
          [[ $missing -eq 0 ]]
