[project]
name = "hilclaw"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6"]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
